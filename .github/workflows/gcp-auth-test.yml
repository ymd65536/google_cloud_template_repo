name: Google Cloud authentication test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticate:
    name: Authenticate with GitHub OIDC
    runs-on: ubuntu-latest
    environment: gcp-poc
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.4

      - name: Confirm project and service account
        run: |
          set -euo pipefail
          test -n "${CLOUDSDK_CORE_PROJECT}"
          echo "Configured project: ${CLOUDSDK_CORE_PROJECT}"
          account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          test -n "${account}"
          echo "Authenticated service account: ${account}"
          gcloud projects describe "${CLOUDSDK_CORE_PROJECT}" \
            --format='value(projectId,projectNumber,lifecycleState)'

      - name: Print safe diagnostics on failure
        if: ${{ failure() }}
        run: |
          echo "Authentication test failed; printing non-sensitive diagnostics."
          gcloud --version || true
          gcloud config list --format='list(core.project,account)' || true
          gcloud auth list --filter=status:ACTIVE --format='value(account)' || true
